# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Corne OLED Display
# CONFIG_ZMK_DISPLAY=y

CONFIG_ZMK_KEYBOARD_NAME="Corne-New"

# CONFIG_ZMK_SETTINGS_RESET_ON_START=y

# Increase Bluetooth transmit power to maximum (+8 dBm)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ===== Energie sparen =====
CONFIG_ZMK_SLEEP=y                     
# Aktiviert Tiefschlaf (Deep Sleep)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000   
# 10 Minuten Inaktivität -> Deep Sleep
# CONFIG_ZMK_PM_SOFT_OFF=y               
# Erlaubt Soft-Off per Tastendruck (&soft_off)
CONFIG_ZMK_USB_LOGGING=n               
# Deaktiviert USB-Logging (spart Strom)

# Falls du später doch RGB oder Display aktivierst, kommen diese dazu:
# CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y   # RGB aus im Idle
# CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y         # Display aus im Idle (standardmäßig an)
